version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: csi-postgres-db
    environment:
      POSTGRES_DB: security_sociale
      POSTGRES_USER: csi_user
      POSTGRES_PASSWORD: csi_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/schema-data.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - csi-network
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: csi-spring-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/security_sociale
      - SPRING_DATASOURCE_USERNAME=csi_user
      - SPRING_DATASOURCE_PASSWORD=csi_password
      - JWT_SECRET=5367566B58703273357638792F423F4528482B4D6251655468576D5A71347437
    depends_on:
      - db
    networks:
      - csi-network
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: csi-react-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - csi-network
    restart: always

volumes:
  postgres_data:

networks:
  csi-network:
    driver: bridge
